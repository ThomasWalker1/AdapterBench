[project]
name = "adapterbench"
version = "0.1.0"
description = "AdapterBench: controlled benchmarks of PEFT representations as hypernetwork outputs"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2,<2",
  "datasets>=3,<6",
  "huggingface-hub>=0.25,<2",
  "pandas>=2,<4",
  "peft>=0.19,<0.20",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "torch>=2.5,<2.6",
  "transformers>=4.57,<5",
]

[project.scripts]
peft-hnet = "peft_hnet.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
