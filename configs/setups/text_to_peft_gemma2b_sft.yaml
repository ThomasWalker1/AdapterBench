schema_version: 1
name: text_to_peft_gemma2b_sft
description: Text-to-LoRA-style end-to-end downstream training with representation held as the experimental variable.
protocol: generic_text_to_adapter
availability: specification_only
runner: peft_hnet.t2p
sources:
  - name: originating_code
    uri: https://github.com/SakanaAI/text-to-lora
    revision: main
models:
  condition_encoder:
    model_id: Alibaba-NLP/gte-large-en-v1.5
    frozen: true
    dtype: bfloat16
  interpreter:
    model_id: google/gemma-2-2b-it
    frozen: true
    dtype: bfloat16
conditioning:
  kind: task_description
  encoder: Alibaba-NLP/gte-large-en-v1.5
  pooling: sentence_embedding
  fields: [task_description]
dataset:
  source: upstream
  dataset_id: SakanaAI/text-to-lora/configs/hyper_lora_decontam_lol_tasks.yaml
  train_split: train_tasks_479
  validation_split: upstream_validation
  test_splits: [seen_benchmarks, unseen_tasks]
  task_id_field: dataset_name
  family_field: benchmark_family
  condition_field: task_description
  input_field: prompt
  target_field: answer
  holdout_unit: task
objective:
  kind: downstream
  downstream_weight: 1.0
  reconstruction_weight: 0.0
evaluation:
  primary_metric: benchmark_accuracy_mean
  metrics: [accuracy, exact_match, pass_at_1, generation_latency, interpreter_tokens_per_second]
  baselines: [frozen_interpreter, interpreter_with_icl, oracle_adapter, released_t2l]
  report_by: [task, seen_vs_unseen, representation]
  generation:
    use_icl: true
    num_fewshot: 3
runtime:
  launcher: torchrun
  num_processes: 8
  mixed_precision: bf16
  gradient_checkpointing: true
fixed_controls:
  - condition encoder and hypernetwork shell
  - frozen interpreter
  - task and description splits
  - update and token budget
  - downstream evaluator
notes:
  - The LoRA arm is runnable through the pinned upstream pipeline. Alternative representation codecs are under implementation and must pass downstream evaluation before this setup is marked runnable.

