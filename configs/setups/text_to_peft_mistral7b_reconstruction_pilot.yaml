schema_version: 1
name: text_to_peft_mistral7b_reconstruction_pilot
description: Small-scale (8-task) self-trained Text-to-PEFT reconstruction pilot using a Mistral-7B-Instruct-v0.2 interpreter, validating the training half of the pipeline rather than producing a competitive benchmark result.
protocol: text_to_lora
availability: runnable
runner: upstream/SakanaAI/text-to-lora@8ba77493eb8c732bac41c22ca76117dcacfcf2a4
sources:
  - name: paper
    uri: https://openreview.net/forum?id=zWskCdu3QA
  - name: code
    uri: https://github.com/SakanaAI/text-to-lora
    revision: main
models:
  condition_encoder:
    model_id: Alibaba-NLP/gte-large-en-v1.5
    frozen: true
    dtype: bfloat16
  interpreter:
    model_id: mistralai/Mistral-7B-Instruct-v0.2
    frozen: true
    dtype: bfloat16
conditioning:
  kind: task_description
  encoder: Alibaba-NLP/gte-large-en-v1.5
  pooling: upstream_text_to_lora
  fields: [task_description]
dataset:
  source: upstream
  dataset_id: SakanaAI/text-to-lora/configs/hyper_lora_decontam_lol_tasks.yaml
  train_split: train_tasks_8_pilot
  validation_split: upstream_validation
  test_splits: [seen_benchmarks]
  task_id_field: dataset_name
  family_field: benchmark_family
  condition_field: task_description
  input_field: prompt
  target_field: answer
  holdout_unit: task
objective:
  kind: reconstruction
  downstream_weight: 0.0
  reconstruction_weight: 1.0
  oracle_adapter_source: self_trained_task_specific_adapters
evaluation:
  primary_metric: benchmark_accuracy_mean
  metrics: [accuracy, exact_match, generation_latency]
  baselines: [frozen_interpreter]
  report_by: [task, representation]
  generation:
    use_icl: false
    num_fewshot: 0
runtime:
  launcher: single
  num_processes: 1
  mixed_precision: bf16
  gradient_checkpointing: false
fixed_controls:
  - gte-large-en-v1.5 condition encoder
  - frozen Mistral-7B-Instruct-v0.2 interpreter
  - 8-task training split (lol_022, lol_033, lol_034, lol_035, lol_039, lol_043, lol_044, lol_045)
  - hypernetwork hidden architecture
notes:
  - "This is a Phase 2 pilot, not a full-scale run: 8 tasks vs. the released checkpoint's 479, and the hypermod.pt is self-trained via scripts/train_lora_baselines.py + scripts/train_hyper_recon.py, not downloaded."
  - "Purpose is validating that peft_hnet's ReleasedTextToLoRABackend/HFDownstreamEvaluator work against a self-trained checkpoint, not just the one released checkpoint they were originally built against. Weak accuracy on held-out benchmarks is expected and not itself a finding."
  - "Do not average or compare these numbers against text_to_peft_gemma2b_reconstruction's results: different interpreter model, different training scale, different task family."
