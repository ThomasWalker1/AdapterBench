schema_version: 1
name: text_to_peft_sft_pilot
description: Small-scale live end-to-end SFT pilot — hypernetwork output hooked live into a real frozen interpreter's forward pass, trained on real next-token loss (Sakana's actual main training method), validating the training+eval loop itself rather than producing a competitive benchmark result.
protocol: generic_text_to_adapter
availability: runnable
runner: peft_hnet.t2p
sources:
  - name: originating_code
    uri: https://github.com/SakanaAI/text-to-lora
    revision: main
models:
  condition_encoder:
    model_id: Alibaba-NLP/gte-large-en-v1.5
    frozen: true
    dtype: bfloat16
  interpreter:
    model_id: Qwen/Qwen3-0.6B
    frozen: true
    dtype: bfloat16
conditioning:
  kind: task_description
  encoder: Alibaba-NLP/gte-large-en-v1.5
  pooling: upstream_text_to_lora
  fields: [task_description]
dataset:
  source: upstream
  dataset_id: "Lots-of-LoRAs/task*  (per-task HF Hub mirror of Super-NaturalInstructions; resolved per task_id via upstream/text-to-lora/tasks/*/metadata.yaml, same convention as text_to_peft_gemma2b_sft.yaml)"
  train_split: pilot_tasks_8
  validation_split: null
  test_splits: [seen_benchmarks]
  task_id_field: dataset_name
  family_field: benchmark_family
  condition_field: task_description
  input_field: prompt
  target_field: answer
  holdout_unit: task
objective:
  kind: downstream
  downstream_weight: 1.0
  reconstruction_weight: 0.0
evaluation:
  primary_metric: benchmark_accuracy_mean
  metrics: [accuracy, exact_match]
  baselines: [frozen_interpreter]
  report_by: [task, representation]
  generation:
    use_icl: false
    num_fewshot: 0
runtime:
  launcher: single
  num_processes: 1
  mixed_precision: bf16
  gradient_checkpointing: false
fixed_controls:
  - gte-large-en-v1.5 condition encoder
  - frozen Qwen/Qwen3-0.6B interpreter (small model, deliberately — this is a plumbing pilot, not a competitive result)
  - 8-task training split (lol_022, lol_033, lol_034, lol_035, lol_039, lol_043, lol_044, lol_045 — same tasks Phase 2 already used; none source from boolq or hellaswag, the eval families used here, so no train/eval leakage)
  - hypernetwork hidden architecture
notes:
  - "Restructures the benchmark around live end-to-end SFT training (see PROJECT_PLAN.md Phase 4) — supersedes the retired reconstruction-matching approach (archived under archive/) as the sole training/eval mechanism."
  - "Small model (Qwen3-0.6B) and small task set chosen deliberately for a first honest end-to-end validation, not a competitive result — mirrors this project's established small-scale-first pattern (Phase 1/2/3 pilots)."
  - "Only 6 of the 8 listed training tasks are decontamination-clean against ALL benchmark families (lol_033/lol_034 are winogrande-sourced); safe here specifically because this setup only evaluates boolq/hellaswag, not winogrande — re-check before adding new eval families."
