schema_version: 1
name: synthetic_sft_pilot
description: Lightweight live end-to-end SFT setting — a tiny, freshly initialized (not downloaded) real transformers causal LM trained on synthetic algorithmic tasks with exactly known correct answers, for validating that a codec is expressive enough to learn a task at all, decoupled from real-world task noise. No network dependency, CPU-friendly.
protocol: generic_text_to_adapter
availability: runnable
runner: adapterbench.t2p
sources:
  - name: originating_code
    uri: https://github.com/SakanaAI/text-to-lora
    revision: main
models:
  condition_encoder:
    model_id: Alibaba-NLP/gte-large-en-v1.5
    frozen: true
    dtype: float32
  interpreter:
    model_id: "synthetic-tiny-llama-2L-h32 (freshly initialized LlamaForCausalLM, not a downloaded checkpoint; see t2p/tiny_interpreter.py)"
    frozen: true
    dtype: float32
conditioning:
  kind: task_description
  encoder: Alibaba-NLP/gte-large-en-v1.5
  pooling: upstream_text_to_lora
  fields: [task_description]
dataset:
  source: synthetic
  dataset_id: "synthetic:algorithmic_v1 (t2p/synthetic_tasks.py::TASK_FAMILIES — copy, reverse, increment, sort, constant)"
  train_split: train_descriptions
  validation_split: null
  test_splits: [held_out_descriptions]
  task_id_field: family_name
  family_field: family_name
  condition_field: task_description
  input_field: digits
  target_field: transformed_digits
  holdout_unit: task
objective:
  kind: downstream
  downstream_weight: 1.0
  reconstruction_weight: 0.0
evaluation:
  primary_metric: exact_match_mean
  metrics: [exact_match]
  baselines: [frozen_interpreter]
  report_by: [task, adapter]
  generation:
    use_icl: false
    num_fewshot: 0
runtime:
  launcher: single
  num_processes: 1
  mixed_precision: "no"
  gradient_checkpointing: false
fixed_controls:
  - tiny frozen interpreter architecture and init seed (t2p/tiny_interpreter.py)
  - gte-large-en-v1.5 condition encoder (same as the real Qwen3/Lots-of-LoRAs setting)
  - 5 synthetic task families with exactly known ground-truth transforms
  - hypernetwork hidden architecture
notes:
  - "Second, lightweight setting for the live-SFT mechanism (see PROJECT_PLAN.md) — purely additive, does not change the real Qwen3/Lots-of-LoRAs setting (text_to_peft_sft_pilot)."
  - "Ground truth (exactly known correct transforms) decouples 'is this codec expressive enough to learn the task' from 'does it help on a real, noisy benchmark' — the real setting's LoRA-vs-IA3/steering gap could be either; this setting isolates the former."
  - "Cheap enough to finally exercise the dense-ΔW codecs (FourierFT, LoKr) through live SFT end-to-end, which Phase 4 explicitly deferred at real-model scale due to a live-forward-graph memory risk — that risk is specific to real model dimensions and remains open there."
  - "No network or GPU dependency: the interpreter is constructed in-process (never downloaded), and the condition encoder is CPU-friendly."
