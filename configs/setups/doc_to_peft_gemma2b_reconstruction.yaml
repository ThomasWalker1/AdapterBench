schema_version: 1
name: doc_to_peft_gemma2b_reconstruction
description: Doc-to-PEFT disk-artifact reproduction of a released Doc-to-LoRA (D2L) checkpoint, conditioned on a document via cross-attention over the frozen Gemma-2-2B-IT interpreter's own per-layer activations, evaluated on needle-in-a-haystack (ctx_magic_number) tasks.
protocol: doc_to_lora
availability: runnable
runner: upstream/SakanaAI/doc-to-lora@baa85db4d5df9b29d618af432d6ebf28b3ad5a29
sources:
  - name: paper
    uri: https://openreview.net/forum?id=iW1oBBO72S
  - name: code
    uri: https://github.com/SakanaAI/doc-to-lora
    revision: main
  - name: released_checkpoint
    uri: https://huggingface.co/SakanaAI/doc-to-lora
    revision: 7514da3cf18439265aef805f2a00170199e44456
models:
  interpreter:
    model_id: google/gemma-2-2b-it
    frozen: true
    dtype: bfloat16
conditioning:
  kind: document
  encoder: shared_interpreter_per_layer_activations
  pooling: null
  fields: [context]
dataset:
  source: upstream
  dataset_id: SakanaAI/doc-to-lora/data/generate_ctx_magic_number.py
  train_split: train
  validation_split: val
  test_splits:
    - ctx_magic_number_32_1024
    - ctx_magic_number_1024_2048
    - ctx_magic_number_2048_3072
    - ctx_magic_number_3072_4096
    - ctx_magic_number_4096_5120
    - ctx_magic_number_5120_6144
    - ctx_magic_number_6144_7168
    - ctx_magic_number_7168_8192
    - ctx_magic_number_8192_9216
    - ctx_magic_number_9216_10240
    - ctx_magic_number_10240_11264
    - ctx_magic_number_11264_12288
    - ctx_magic_number_12288_13312
    - ctx_magic_number_13312_14336
    - ctx_magic_number_14336_15360
    - ctx_magic_number_15360_16384
    - ctx_magic_number_16384_20480
    - ctx_magic_number_20480_24576
    - ctx_magic_number_24576_28672
    - ctx_magic_number_28672_32768
    - ctx_magic_number_32768_40960
    - ctx_magic_number_40960_49152
    - ctx_magic_number_49152_57344
    - ctx_magic_number_57344_65536
    - ctx_magic_number_65536_73728
    - ctx_magic_number_73728_81920
    - ctx_magic_number_81920_90112
    - ctx_magic_number_90112_98304
    - ctx_magic_number_98304_106496
    - ctx_magic_number_106496_114688
    - ctx_magic_number_114688_122880
    - ctx_magic_number_122880_131072
  task_id_field: dataset_bin
  family_field: null
  condition_field: context
  input_field: prompt
  target_field: response
  holdout_unit: document
objective:
  kind: downstream
  downstream_weight: 1.0
  reconstruction_weight: 0.0
  oracle_adapter_source: null
evaluation:
  primary_metric: rougeL_f1
  metrics: [rougeL_f1, n_examples, generation_latency]
  baselines: [frozen_interpreter, interpreter_with_icl]
  report_by: [task, adapter]
  generation:
    max_new_tokens: 32
    max_ctx_chunk_len: 1024
    eval_batch_size_gen: 4
runtime:
  launcher: single
  num_processes: 1
  mixed_precision: bf16
  gradient_checkpointing: false
fixed_controls:
  - frozen Gemma-2-2B-IT interpreter
  - per_layer_activations context encoder (shares the interpreter's own layers, no separate embedding model)
  - perceiver document aggregator (9 blocks, 8 latent queries, 1 pre-head layer)
  - rank-8 LoRA on down_proj only, generated per document
  - downstream evaluator and decoding settings (D2L's own ctx_to_lora.eval_utils.evaluate, ROUGE-L/F1 scoring)
notes:
  - "The released gemma_demo/checkpoint-80000 is QA-trained (train_ds_names in trained_d2l/gemma_demo/args.yaml: self-gen fw_qa_v2, pwc_compact, squad_compact, ropes_compact, drop_compact; val_ds_names: squad, pwc, drop, ropes) - there is no released NIAH-specific D2L checkpoint on SakanaAI/doc-to-lora. Evaluating it on ctx_magic_number_* here is a legitimate generalization test, not the paper's own reported protocol for this checkpoint."
  - "SakanaAI/doc-to-lora also ships gemma_2b_d2l/checkpoint-20000 (same base model, 20k steps vs. gemma_demo's 80k, also QA-trained, matching the 20k-step main-experiment naming used by mistral_7b_d2l/qwen_4b_d2l) as an alternative Gemma checkpoint - not used here; this setup follows README.md's own Python API example, which uses gemma_demo."
  - "D2L's own NIAH training recipe (upstream/doc-to-lora/scripts/niah/{0-gen_data,1-train,2-eval}.sh) trains a *separate* checkpoint from scratch on ctx_magic_number data specifically - that is Setting-2-shaped (live end-to-end training from scratch), not this Setting 1 disk-artifact reproduction, and is out of scope here."
  - "ROUGE-L/F1 is D2L's own scoring metric for this dataset family (ctx_magic_number is not in ctx_to_lora.data.definitions.CLOSED_QA_DATASETS, so eval_generation scores it with compute_rouge rather than the QA-F1 scorer used for squad/drop/ropes) - not a choice made by adapterbench, faithfully reproduced from upstream."
  - "No separate HypernetworkBackend/DownstreamEvaluator split exists for this setup (unlike text_to_peft_*): see adapterbench.doc_to_lora_backend's module docstring for why D2L's own eval API bakes per-document adapter generation and downstream scoring into one call."
