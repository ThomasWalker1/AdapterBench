schema_version: 1
name: lora_r8_d2l
family: lora
implementation: custom
output_structure: Per-document rank-8 LoRA A/B factors for down_proj, generated by a Perceiver document aggregator and merged into the running model's forward pass (never materialized as a portable PEFT adapter directory).
target_modules: [down_proj]
hyperparameters:
  r: 8
  lora_dropout: 0.0
  aggregator_type: perceiver
  ctx_encoder_type: per_layer_activations
  num_blocks: 9
  n_latent_queries: 8
compatible_objectives: [downstream]
supports_batched_generation: false
notes:
  - Exact adapter configuration from the released Doc-to-LoRA gemma_demo checkpoint (trained_d2l/gemma_demo/args.yaml).
  - implementation is "custom", not "peft" - ctx_to_lora.modeling.hypernet applies the generated LoRA via a hand-rolled monkeypatch (combine_lora/lora_forward_packed), not peft.PeftModel, and never saves it as a standalone adapter directory. See adapterbench.doc_to_lora_backend's module docstring.
  - supports_batched_generation is false because ctx_to_lora's own Python API "only supports non-batched inputs" (README.md's own caveat on ModulatedPretrainedModel.internalize).
