schema_version: 1
name: activation_steering
family: activation_steering
implementation: custom
output_structure: Generated additive steering vectors applied to the residual stream at each decoder layer's output.
target_modules: [block]
hyperparameters:
  scale: 1.0
compatible_objectives: [downstream]
supports_batched_generation: true
notes:
  - "Hooks the whole decoder layer's output (the residual stream, target_modules=[block]), not a specific linear submodule — requires the custom t2p hook path (peft has no native PEFT type for this)."
  - "No weight-space delta (ActivationSteeringCodec.dense_delta raises NotImplementedError) — only usable with the downstream (live SFT) objective, not reconstruction matching."
