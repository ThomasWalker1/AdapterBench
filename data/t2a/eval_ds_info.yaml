eval_ds_info:
  arc_challenge:
    descriptions:
    - This task is about analyzing questions which examine your grasp of scientific
      ideas. You must connect conceptual knowledge with practical examples from geology,
      ecology and environmental changes.
    - The objective here is to evaluate various scientific scenarios and infer the
      most logical explanations or definitions based on established knowledge. This
      task will strengthen your analytical and reasoning skills in the context of
      natural science.
    - Your role is to interpret questions focusing on earth science and biological
      interactions. This demands a clear understanding of relevant processes, such
      as decomposition, weathering, and species adaptation.
  arc_easy:
    descriptions:
    - Your job is to discern which information best answers a posed question, focusing
      on practical examples and scientific principles. This requires a strong grasp
      of underlying concepts in ecology or physics.
    - You will analyze questions that explore important connections such as environmental
      issues or animal adaptations. Utilize your background knowledge to evaluate
      and select the most fitting answer.
    - This task involves selecting answers that reflect accurate relationships or
      effects seen in nature or society. You will need to sort through potential choices
      critically to find the appropriate one.
  boolq:
    descriptions:
    - Analyze the given details about various subjects, including movies, sports,
      and television shows. Your role is to confirm whether certain claims are true
      or false.
    - Your task is to determine the truthfulness of specific statements based on the
      provided background information. This requires careful reading and comprehension
      of the content.
    - The goal is to evaluate factual claims made in relation to highlighted texts.
      You will need to discern whether the statements align with the information provided.
  gsm8k:
    descriptions:
    - You will be tasked with interpreting mathematical situations described in words.
      The goal is to use logical reasoning and calculations to determine the numerical
      answers based on the context provided.
    - This task challenges your problem-solving abilities through mathematical reasoning.
      You must carefully read each scenario and systematically work through the data
      to compute the final outcome.
    - Your role is to engage with practical math scenarios presented as questions.
      The task requires translating textual data into numerical operations that will
      lead you to the final solution.
  hellaswag:
    descriptions:
    - This task revolves around completing an unfinished text by selecting an ending
      that matches its tone and context. It requires you to think critically about
      how narratives develop and conclude effectively.
    - This task asks you to select a suitable conclusion for an unfinished narrative
      or instructional content. It tests your comprehension and reasoning skills as
      you assess how well each option aligns with the given text.
    - Your task involves completing an incomplete passage by selecting the ending
      that logically continues the context provided. This requires reading comprehension
      and the ability to infer meaning from a text.
  humaneval:
    descriptions:
    - Engage in building distinct functions that meet the requirements of various
      presented problems, honing your ability to translate problem statements into
      logical code. Utilize structured thinking to implement efficient solutions.
    - You are tasked with generating specific solutions in Python by interpreting
      problem descriptions associated with tasks like counting odds or validating
      inputs. Recognizing patterns and leveraging programming techniques will be beneficial.
    - This task focuses on developing algorithms in Python for specific scenarios,
      such as counting characters, assessing conditions between numbers, or converting
      integers into a different format. Critical thinking and algorithmic design will
      be important.
  lol_035:
    descriptions:
    - Your job is to transform a fill-in-the-blank question by changing just one key
      word or phrase, allowing for a new but coherent answer. This requires analytical
      thinking about vocabulary and context.
    - You need to innovate a way to adjust an existing question so it accepts a different
      name as an answer. This process enhances your skills in vocabulary rich expressions
      and logical reasoning.
    - The objective is to carefully edit questions such that the identity of the answer
      changes while keeping most statements intact. It emphasizes the importance of
      word choice and its impact on meaning.
  lol_039:
    descriptions:
    - This task is about spotting keywords that appear in both sentences. You need
      to focus on meaningful words while ensuring not to include common stop words.
    - The goal here is to extract important overlapping vocabulary from two related
      sentences. This requires critical thinking and familiarity with different word
      derivatives.
    - Your objective is to analyze two sentences and find words that are shared between
      them. This requires insight into language nuances and the ability to discern
      significant terms.
  lol_084:
    descriptions:
    - This task involves assessing a passage with numbered facts about people's movements.
      You need to find and select the fact that clearly indicates the location of
      a specified person based on the context provided.
    - Your task is to read a set of facts within a passage and determine which fact
      provides the necessary information to answer a question about the location of
      a specific person.
    - You will evaluate enumerated facts and a question regarding an individual's
      whereabouts. The goal is to isolate the fact that supplies essential information
      for responding accurately to the question.
  lol_1198:
    descriptions:
    - You need to evaluate whether an action committed by PersonX causes PersonY or
      others to want something indicated in another phrase. It requires you to think
      critically about relationships and emotional connections.
    - Your job is to interpret short sequences of events. For each sequence, decide
      if the first part creates a desire for the second part. Familiarity with human
      behaviors and desires will be crucial in making accurate assessments.
    - In this task, you consider two elements where one may lead to a desire for another.
      Evaluating these connections requires insight into motivations behind human
      behavior and how actions affect relationships.
  lol_140:
    descriptions:
    - In this challenge, you will consider a prompt and its accompanying completions,
      aiming to choose the response that best fits the established style of the prompt.
      Pay attention to informal versus formal tones.
    - The task involves evaluating two responses based on their alignment with the
      style of a given prompt. You need to identify which response mirrors the tone
      and language used in the prompt.
    - This activity involves selecting between two responses based on their similarity
      in style to a prompt. Evaluate tone, word choice, and sentence flow to find
      your answer.
  lol_1448:
    descriptions:
    - You will be presented with different sentences that include medical information.
      The challenge is to recognize and state the name of the disease or disorder
      featured in each sentence.
    - Your task is to read a provided sentence and identify the name of a disorder
      or disease mentioned within it. This requires familiarity with medical terminology
      and conditions.
    - Your job is to decipher sentences containing descriptions of health conditions.
      From these, you must identify and return the appropriate title of the disorder
      or disease.
  lol_1557:
    descriptions:
    - In this activity, you will identify mistakes in given English sentences and
      produce a version that is free from errors. Attention to detail is important
      in ensuring clarity and correctness.
    - The goal here is to carefully analyze flawed sentences and create polished versions.
      Strong language skills are needed to spot errors and make appropriate corrections.
    - This task involves revising sentences that contain mistakes in grammar or style.
      Your ability to recognize these issues and rewrite them correctly will be key.
  lol_1711:
    descriptions:
    - In this task, you need to write a short poem inspired by a title. The focus
      is on capturing the voice of a young child, using straightforward language and
      continuous sentences.
    - This task requires you to generate a poem related to a provided title. Think
      like a child, keeping the language simple and letting your thoughts flow freely
      without stopping for punctuation.
    - You will create a light-hearted poem related to a given title. It should be
      straightforward and fun, reflecting the spontaneous and imaginative ideas of
      young children through unpunctuated lines.
  lol_202:
    descriptions:
    - This task requires critical thinking as you examine a statement and three choices.
      You are to find the sentence that represents a disagreement with what is stated,
      showing an understanding of contrasting ideas.
    - In this task, you will evaluate a statement and three possible responses. Your
      objective is to identify which response presents an opposing viewpoint or argument
      to the original statement provided.
    - In this exercise, you will encounter a statement and three accompanying sentences.
      Your role is to isolate the sentence that most directly contradicts the premise
      of the original statement, requiring strong analytical skills.
  lol_275:
    descriptions:
    - The assignment challenges you to rethink sentence structures based on targeted
      changes. Your ability to navigate aspects like voice and number will be essential
      in achieving the desired modifications accurately.
    - "In this activity, you\u2019ll be tasked with modifying provided text based\
      \ on specific rules concerning tense, number, or voice. You need to apply linguistic\
      \ knowledge creatively while ensuring coherence within your changes."
    - "You\u2019re challenged to change sentences in particular ways, such as altering\
      \ verb tenses or noun numbers. It requires careful attention to detail in understanding\
      \ how these changes affect the overall structure of the sentences."
  lol_304:
    descriptions:
    - You are tasked with identifying what the marked number refers to in a conversational
      excerpt. It requires logical reasoning and an understanding of situational cues
      present in the text.
    - Engage with dialogues to uncover what meaning lies behind an underlined number.
      Recognizing references, ages, or other implied categories based on conversational
      context is essential in this task.
    - This task focuses on determining the definition or representation of a highlighted
      number within text-based interactions. Understanding context and relationships
      between elements is crucial for success.
  lol_362:
    descriptions:
    - Your role is to analyze a conversation and select the response that effectively
      embraces the idea of collaboration in humor. Look for the one that acknowledges
      the previous statement and adds more to the narrative.
    - This task involves interpreting a given prompt from an improv comedy perspective.
      You must identify which of two responses aligns with the principle of agreeing
      and expanding on a topic to keep the dialogue flowing.
    - This task challenges you to determine which response exemplifies a key improvisational
      concept by accepting what has already been stated and taking it in a new direction,
      contributing to story development or humor.
  lol_614:
    descriptions:
    - You are tasked with dissecting a short story by focusing on one key sentence.
      Reflect on prior occurrences in the narrative to see how they connect as causes
      or enabling factors for that moment in the plot.
    - Your objective is to analyze a chosen sentence within a story. You should consider
      prior events that may have directly led to this moment, creating connections
      that showcase cause-and-effect dynamics within the narrative flow.
    - The task here is to interpret a brief narrative by selecting a particular line
      for examination. Assess what happens before this point to establish whether
      any prior actions contribute as causes or simply set the stage.
  lol_636:
    descriptions:
    - You will be working on a list that includes both numerical values and lowercase
      alphabets. The focus is on filtering out the alphabets, ensuring there are no
      repeats, and sorting them in alphabetical order.
    - In this task, you need to work with a list that contains both numbers and letters.
      Your goal is to find and organize the letters in alphabetical order, ensuring
      that only unique letters are included.
    - This task involves analyzing a list comprised of various items, including digits
      and lowercase letters. You must identify the letters, sort them without duplicates,
      and prepare them for output.
  lol_701:
    descriptions:
    - In this exercise, you will encounter various computer science-related scenarios.
      Assess your understanding of programming operations, code functionality, and
      data management to provide accurate answers.
    - You're tasked with answering questions that assess your understanding of high
      school computer science topics. Leverage your familiarity with programming languages,
      computer security, and data structures as you provide your response.
    - This task involves interpreting computer science questions and applying relevant
      concepts to arrive at a correct answer. You should focus on key ideas in programming
      and system functionality.
  lol_705:
    descriptions:
    - The objective of this task is to evaluate your understanding of various macroeconomic
      principles. You will analyze questions about fiscal policies, money circulation,
      and market behaviors to derive the right conclusions.
    - You will explore high school-level macroeconomic topics through a series of
      questions. Your job is to identify the correct assertions that align with your
      comprehension of economic functions and behavior.
    - This task involves critically thinking about macroeconomic concepts and their
      implications. You need to interpret various dynamics like aggregate demand and
      fiscal measures while identifying the most appropriate answer.
  lol_706:
    descriptions:
    - Your task is to apply your knowledge of high school mathematics to solve various
      problems, requiring logical reasoning and an understanding of mathematical principles.
    - This activity involves interpreting mathematical questions, translating them
      into calculations, and determining the correct outcomes through analytical thinking.
    - Delve into questions that require you to connect mathematical concepts with
      practical applications. Your task will be to pull from your math knowledge in
      order to resolve each query thoughtfully.
  lol_710:
    descriptions:
    - Your role is to navigate through a series of statistics questions that require
      practical knowledge about quantitative research methods. This includes understanding
      how different sampling strategies can influence research outcomes.
    - Engage with statistical queries that challenge your knowledge of data interpretation
      and analysis. The task entails distinguishing correct statements based on principles
      like mean comparison, sampling distributions, and experimental design.
    - In this exercise, you'll be assessing a range of assertions regarding statistical
      terms and principles. Drawing upon your background in statistics will enable
      you to identify valid conclusions from those presented.
  lol_717:
    descriptions:
    - The objective is to evaluate various scenarios presented in the form of questions
      and accurately identify the logical fallacies at play. Critical thinking skills
      are crucial for this task.
    - You are tasked with assessing hypothetical arguments for flawed logic. Being
      well-versed in identifying common fallacies will support you in this analytical
      challenge.
    - In this exercise, you analyze statements regarding logical reasoning to determine
      which fallacy is being described. This requires familiarity with various types
      of logical errors in argumentation.
  lol_726:
    descriptions:
    - Engage with questions centered around philosophical themes and thinkers. This
      requires a solid understanding of philosophical arguments and an ability to
      discern correct interpretations from the given choices.
    - Engage in a thoughtful exploration of significant philosophical questions, focusing
      on concepts put forth by renowned thinkers. Your task revolves around accurately
      identifying which interpretation is most aligned with established views.
    - You will navigate through questions that test your grasp of philosophical principles.
      The task requires critical thinking, as you analyze the provided answers to
      find the one that accurately reflects philosophical understanding.
  lol_742:
    descriptions:
    - Your goal is to read a given text and pinpoint answers related to event frequency.
      This might include identifying how many times an event has happened or how often
      it is likely to occur, based on the information provided.
    - "You\u2019ll be engaging with texts that mention different activities and assessing\
      \ how often they occur. This requires analytic thinking as you need to extract\
      \ meaningful information without extraneous details."
    - "The challenge lies in extracting succinct answers from written material regarding\
      \ how frequently various events happen. You\u2019ll need to interpret descriptions\
      \ carefully, determining the most likely answers based on context."
  mbpp:
    descriptions:
    - Your challenge is to solve a series of problems by writing functions in Python.
      These problems require handling lists and strings, allowing you to showcase
      your proficiency in coding while addressing practical programming scenarios.
    - You will be tasked with creating various Python functions that tackle programming
      challenges. The exercises will test your ability to manipulate data structures,
      search for patterns, and implement checks on numerical products.
    - The goal is to develop Python functions that perform designated operations on
      lists and strings. This requires a solid grasp of logical reasoning and the
      ability to apply relevant algorithms in your code.
  openbookqa:
    descriptions:
    - Analyze the provided statements carefully and determine which one best fits
      into the context of the passage. This requires comprehension skills and the
      ability to make logical inferences.
    - Consider each option in relation to what is presented in the input. Discern
      which one logically completes or responds accurately to the notion being expressed.
    - Here, you'll be presented with different statements, and your role is to decide
      which one appropriately complements or responds to a scenario. This process
      involves critical analysis and synthesis of information.
  piqa:
    descriptions:
    - You will explore practical questions and select an answer that presents a logical
      and widely accepted approach to solve a given problem or complete a task successfully.
    - Analyze the provided scenarios where practical advice or solutions are required,
      focusing on selecting the most commonly used or convenient method.
    - Given a question related to common tasks, your responsibility is to discern
      which proposed solution aligns with typical practices or makes the task easier
      to achieve.
  winogrande:
    descriptions:
    - In this exercise, you need to read short narratives and discern which person
      or object fits best within the context of the sentence.
    - This task requires synthesizing information from concise textual scenarios to
      identify crucial elements that drive the narrative forward.
    - The goal is to evaluate descriptions and select the entity that best aligns
      with the sentiments or actions presented in the scenario.
