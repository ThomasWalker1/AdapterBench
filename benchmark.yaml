schema_version: 1

benchmark:
  name: AdapterBench
  slug: adapterbench
  version: 0.1.0
  description: >-
    AdapterBench tests whether the shape of a hypernetwork-generated PEFT adapter
    matters. The hypernetwork shell, training loop, data, and evaluator are held
    fixed within each setting; only the generated representation (the codec) varies.
    Two active settings: task-description conditioning (T2A, gemma-2-2b) and
    document conditioning (D2A, Qwen3-0.6B). Headline metrics are behavioral
    matched-minus-control scores (ROUGE-L for T2A, exact-match retrieval for D2A).

license: see repository LICENSE / CITATION.cff

repository: https://github.com/ThomasWalker1/AdapterBench

website:
  # Static site generated by scripts/build_website.py
  source_dir: website
  entry: index.html
  build_command: uv run adapterbench website build
  # Relative path when vendored into a personal site (see website/INTEGRATION.md)
  deploy_path: benchmarks/adapterbench

evaluation:
  primary_metrics:
    - setting: T2A
      metric: held_out_rouge_l
      comparison: matched_minus_control
      direction: higher_is_better
    - setting: D2A
      metric: numeric_decoy_needle_retrieval_exact_match_accuracy
      comparison: matched_minus_control
      direction: higher_is_better

resources:
  gpu_required: true
  network_required: true  # Hugging Face models/datasets on first setup

paths:
  readme: README.md
  contributing: CONTRIBUTING.md
  guide: GUIDE.md
  contract: BENCHMARK_CONTRACT.md
  leaderboards: leaderboards/
  canonical_results: canonical_results/
  reproduce: scripts/reproduce/
  tests: tests

settings:
  - id: T2A
    interpreter: google/gemma-2-2b-it
    metric: ROUGE-L matched − static*
    seeds: 3 confirmation seeds per codec
  - id: D2A
    interpreter: Qwen/Qwen3-0.6B
    metric: exact-match matched − context-swap
    seeds: 5 seeds per codec
